<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美睫客戶紀錄表 極速版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lashPink: '#F6E6E8',
                        lashDarkPink: '#D2B4B8',
                        lashText: '#4A4A4A',
                        lashLight: '#FBF8F8'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F8F5F5;
            color: #4A4A4A;
            -webkit-tap-highlight-color: transparent;
        }
        input, select, textarea {
            font-size: 14px !important;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="pb-28 select-none">

    <!-- 頂部標題與導覽 -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-lashPink/60">
        <div class="flex items-center justify-center px-4 h-12 relative">
            <h1 class="text-sm font-semibold tracking-wider text-gray-700">美睫客戶紀錄表</h1>
        </div>

        <!-- 主要頁籤 -->
        <div class="flex px-4 py-2 gap-3 bg-white border-t border-gray-100">
            <button onclick="switchTab('add')" id="btn-tab-add" class="flex-1 bg-lashPink/40 text-gray-700 font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-sm border border-lashPink/60">
                <i class="fa-solid fa-plus text-[10px]"></i> 新增紀錄
            </button>
            <button onclick="switchTab('history')" id="btn-tab-history" class="flex-1 bg-gray-100 text-gray-500 font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition border border-transparent">
                <i class="fa-solid fa-clock-rotate-left text-[10px]"></i> 歷史紀錄
            </button>
        </div>
    </header>

    <!-- 內容主體 -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- ================= 頁籤 1：新增紀錄表單 ================= -->
        <div id="panel-add" class="space-y-4">
            
            <!-- 基本資訊 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-lashPink/40 space-y-3">
                <div class="flex items-center gap-2 border-b border-lashPink/40 pb-2">
                    <div class="w-1.5 h-4 bg-lashDarkPink rounded-full"></div>
                    <h2 class="text-xs font-bold text-gray-700 tracking-wider">基本資訊</h2>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">日期</label>
                        <input type="date" id="input-date" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">嫁接時間 (開始)</label>
                        <input type="time" id="input-starttime" value="12:38" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-1">
                    <div class="relative">
                        <label class="block text-[11px] text-gray-400 mb-1">客戶姓名 (可搜尋舊客)</label>
                        <input type="text" id="input-name" placeholder="輸入姓名自動代入" oninput="filterCustomerSuggestions(this.value)" onblur="setTimeout(updateAccountDisplay, 200)" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                        <!-- 舊客自動完成下拉選單 -->
                        <div id="customer-suggestions" class="absolute left-0 right-0 top-16 bg-white border border-lashPink/60 rounded-xl shadow-lg z-30 hidden max-h-40 overflow-y-auto"></div>
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">Line ID / 電話</label>
                        <input type="text" id="input-phone" placeholder="請輸入 Line ID 或電話" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-1">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">Instagram / Threads</label>
                        <input type="text" id="input-artist" placeholder="輸入帳號 (例: @e_lash)" value="@e_lash" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">客戶類別</label>
                        <select id="input-customertype" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="一般">一般</option>
                            <option value="VIP">VIP</option>
                            <option value="新客">新客</option>
                        </select>
                    </div>
                </div>

                <!-- 生日與下次預約 -->
                <div class="pt-1">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">生日</label>
                            <input type="date" id="input-birthday" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                        </div>
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">預計回訪/下次預約</label>
                            <input type="date" id="input-next-visit" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-1">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">天氣</label>
                        <select id="input-weather" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="晴天">☀️ 晴天</option>
                            <option value="陰天">☁️ 陰天</option>
                            <option value="雨天">🌧️ 雨天</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">濕度 (%)</label>
                        <input type="number" id="input-humidity" value="65" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">溫度 (°C)</label>
                        <input type="number" id="input-temperature" value="25" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                </div>

                <div class="pt-1">
                    <label class="block text-[11px] text-gray-400 mb-1">服務項目</label>
                    <select id="input-service" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                        <option value="接睫">接睫</option>
                        <option value="補睫">補睫</option>
                        <option value="卸睫">卸睫</option>
                    </select>
                </div>
            </div>

            <!-- 睫毛設計 -->
            <div class="bg-lashLight rounded-2xl p-4 shadow-sm border border-lashPink/60 space-y-4">
                <div class="flex items-center gap-2 border-b border-lashPink/50 pb-2">
                    <div class="w-1.5 h-4 bg-lashDarkPink rounded-full"></div>
                    <h2 class="text-xs font-bold text-gray-700 tracking-wider">睫毛設計對應圖</h2>
                </div>

                <!-- 左眼設計區 -->
                <div class="bg-white/80 rounded-xl p-3 border border-lashPink/40 space-y-4">
                    <div class="text-center font-serif text-xs font-semibold text-gray-700">左眼 / Left Eye</div>
                    <div class="relative">
                        <div class="text-[10px] text-lashDarkPink text-center font-medium mb-2">上睫毛</div>
                        <div class="flex justify-between items-center relative z-10 px-1" id="left-up-container">
                            <button type="button" onclick="openKeypad('left-up', 0)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-up', 1)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-up', 2)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-up', 3)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-lashPink text-xs flex items-center justify-center font-semibold text-gray-800 shadow-xs">8</button>
                            <button type="button" onclick="openKeypad('left-up', 4)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-up', 5)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-up', 6)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-lashPink text-xs flex items-center justify-center font-semibold text-gray-800 shadow-xs">9</button>
                            <button type="button" onclick="openKeypad('left-up', 7)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-up', 8)" class="lash-circle w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                        </div>
                        <svg class="absolute inset-x-0 top-5 w-full h-8 pointer-events-none" viewBox="0 0 300 30" preserveAspectRatio="none">
                            <path d="M 10 20 Q 150 -10 290 20" fill="none" stroke="#D2B4B8" stroke-width="1" stroke-dasharray="3 3"/>
                        </svg>
                    </div>

                    <div class="relative pt-2 border-t border-lashPink/30">
                        <div class="text-[10px] text-lashDarkPink text-center font-medium mb-2">下睫毛</div>
                        <div class="flex justify-between items-center relative z-10 px-1" id="left-down-container">
                            <button type="button" onclick="openKeypad('left-down', 0)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 1)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 2)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 3)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 4)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-lashPink text-xs flex items-center justify-center font-semibold text-gray-800 shadow-xs">5</button>
                            <button type="button" onclick="openKeypad('left-down', 5)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 6)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 7)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('left-down', 8)" class="lash-circle-d w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                        </div>
                    </div>
                </div>

                <!-- 右眼設計區 -->
                <div class="bg-white/80 rounded-xl p-3 border border-lashPink/40 space-y-4">
                    <div class="text-center font-serif text-xs font-semibold text-gray-700">右眼 / Right Eye</div>
                    <div class="relative">
                        <div class="text-[10px] text-lashDarkPink text-center font-medium mb-2">上睫毛</div>
                        <div class="flex justify-between items-center relative z-10 px-1" id="right-up-container">
                            <button type="button" onclick="openKeypad('right-up', 0)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-up', 1)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-up', 2)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-up', 3)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-lashPink text-xs flex items-center justify-center font-semibold text-gray-800 shadow-xs">9</button>
                            <button type="button" onclick="openKeypad('right-up', 4)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-up', 5)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-up', 6)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-lashPink text-xs flex items-center justify-center font-semibold text-gray-800 shadow-xs">8</button>
                            <button type="button" onclick="openKeypad('right-up', 7)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-up', 8)" class="lash-circle-ru w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                        </div>
                        <svg class="absolute inset-x-0 top-5 w-full h-8 pointer-events-none" viewBox="0 0 300 30" preserveAspectRatio="none">
                            <path d="M 10 20 Q 150 -10 290 20" fill="none" stroke="#D2B4B8" stroke-width="1" stroke-dasharray="3 3"/>
                        </svg>
                    </div>

                    <div class="relative pt-2 border-t border-lashPink/30">
                        <div class="text-[10px] text-lashDarkPink text-center font-medium mb-2">下睫毛</div>
                        <div class="flex justify-between items-center relative z-10 px-1" id="right-down-container">
                            <button type="button" onclick="openKeypad('right-down', 0)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 1)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 2)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 3)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 4)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 5)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 6)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 7)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                            <button type="button" onclick="openKeypad('right-down', 8)" class="lash-circle-rd w-7 h-7 rounded-full border border-lashDarkPink bg-white text-xs flex items-center justify-center font-medium text-gray-700 shadow-xs"></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 規格與價格設定 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-lashPink/40 space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">嫁接總根數</label>
                        <input type="number" id="input-total" placeholder="例: 100" value="100" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">翹度</label>
                        <select id="input-curl" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="CC">CC 翹</option>
                            <option value="C">C 翹</option>
                            <option value="D">D 翹</option>
                            <option value="B">B 翹</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">粗度 (mm)</label>
                        <select id="input-thick" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="0.15mm">0.15mm</option>
                            <option value="0.10mm">0.10mm</option>
                            <option value="0.07mm">0.07mm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">睫毛種類</label>
                        <select id="input-type" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="單根">單根</option>
                            <option value="3D">3D</option>
                            <option value="5D">5D</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">設計風格</label>
                        <select id="input-style" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="可愛">可愛</option>
                            <option value="性感">性感</option>
                            <option value="優雅">優雅</option>
                            <option value="下睫">下睫</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">黑膠類型</label>
                        <select id="input-glue" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                            <option value="速乾">速乾</option>
                            <option value="低敏">低敏</option>
                            <option value="極速">極速</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-lashPink/30 pt-3 space-y-3">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-4 bg-lashDarkPink rounded-full"></div>
                        <h3 class="text-xs font-bold text-gray-700 tracking-wider">消費資訊</h3>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">原始金額 (NT$)</label>
                            <input type="number" id="input-orig" value="1600" oninput="calculateFinalPrice()" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                        </div>
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">折扣</label>
                            <input type="text" id="input-discount" value="9折" oninput="calculateFinalPrice()" class="w-full p-2.5 bg-lashLight rounded-xl border border-lashPink/60 outline-none text-gray-700">
                        </div>
                    </div>

                    <!-- 折扣後金額與支付方式 -->
                    <div class="grid grid-cols-2 gap-3 items-end">
                        <div class="bg-lashPink/20 rounded-xl p-2.5 flex flex-col justify-center border border-lashPink/50 h-[62px]">
                            <span class="text-[10px] text-gray-500 font-medium">折扣後實收</span>
                            <span class="text-lg font-bold text-lashDarkPink leading-tight" id="display-final-price">NT$ 1,440</span>
                        </div>
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">支付方式</label>
                            <select id="input-pay-method" onchange="handlePayMethodChange()" class="w-full p-2.5 bg-white rounded-xl border border-lashPink/60 outline-none text-gray-700 h-[42px]">
                                <option value="現金">現金</option>
                                <option value="轉帳">轉帳</option>
                                <option value="LINE Pay">LINE Pay</option>
                                <option value="儲值扣款">儲值扣款</option>
                            </select>
                        </div>
                    </div>

                    <!-- 會員儲值與點數管理 -->
                    <div class="bg-white rounded-xl p-3 border border-lashPink/60 shadow-sm space-y-2 mt-2">
                        <div class="flex justify-between items-center border-b border-gray-50 pb-2">
                            <span class="font-bold text-gray-700 text-xs"><i class="fa-solid fa-wallet text-lashDarkPink mr-1"></i> 儲值與點數 (滿百送1點)</span>

    <!-- ================= 數字鍵盤 Modal ================= -->

                <button onclick="pressKey('7')" class="bg-lashLight py-3 rounded-xl font-bold text-gray-700 text-base border border-lashPink/30">7</button>

                <button onclick="pressKey('13')" class="bg-lashLight py-3 rounded-xl font-bold text-gray-700 text-base border border-lashPink/30">13</button>
                <button onclick="pressKey('14')" class="bg-lashLight py-3 rounded-xl font-bold text-gray-700 text-base border border-lashPink/30">14</button>
                <button onclick="pressKey('15')" class="bg-lashLight py-3 rounded-xl font-bold text-gray-700 text-base border border-lashPink/30">15</button>

    <!-- JavaScript -->
    <script>
        const CORRECT_PASSWORD = '1130'; // 👈 修改這裡的 1234 就可以換密碼囉！

        let currentActiveButton = null;
        let uploadedImages = ['', '', '']; // 暫存上傳的圖片資料
        let isHistoryUnlocked = false; // 紀錄解鎖狀態

        let records = JSON.parse(localStorage.getItem('lash_records_v2')) || [
            {
                date: '2026-07-27',
                name: '林雲',
                phone: 'lin_yun_99',
                artist: '@e_lash',
                service: '接睫',
                time: '12:38',
                birthday: '1995-08-10',
                age: '30 歲',
                nextVisit: '2026-08-24',
                weather: '☀️ 晴天 濕度65% 25°C',
                curl: 'CC',
                total: '100',
                thick: '0.15mm',
                type: '單根',
                glue: '速乾',
                price: '1600',
                discount: '9折',
                final: '1,440',
                payMethod: '現金',
                topup: '',
                deduct: '',
                ptsAdd: '14',
                ptsSub: '',
                balance: 0,
                ptsBalance: 14,
                typeLabel: '一般',
                remark: '左邊中間空洞',
                photos: []
            }
        ];

        // 初始化預設日期為今天
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('input-date').value = todayStr;
        document.getElementById('history-month-filter').value = todayStr.substring(0, 7);

        // 自動計算 4 週 (28天) 後的回訪日
        function calculateNextVisit(baseDateStr) {
            if (!baseDateStr) return '';
            const d = new Date(baseDateStr);
            d.setDate(d.getDate() + 28);
            return d.toISOString().split('T')[0];
        }

        // 綁定日期改變事件，連動更新下次預約日
        document.getElementById('input-date').addEventListener('change', function(e) {
            document.getElementById('input-next-visit').value = calculateNextVisit(e.target.value);
        });

        // 初始載入時設定下次預約日
        document.getElementById('input-next-visit').value = calculateNextVisit(todayStr);

        // 取得客戶儲值與點數餘額
        function getCustomerBalances(name) {
            if (!name) return { bal: 0, pts: 0 };
            let bal = 0;
            let pts = 0;
            records.forEach(r => {
                if (r.name === name) {
                    bal += (parseInt(r.topup) || 0) - (parseInt(r.deduct) || 0);
                    pts += (parseInt(r.ptsAdd) || 0) - (parseInt(r.ptsSub) || 0);
                }
            });
            return { bal, pts };
        }

        // 更新畫面上的餘額顯示
        function updateAccountDisplay() {
            const name = document.getElementById('input-name').value.trim();
            const acc = getCustomerBalances(name);
            const display = document.getElementById('display-current-balances');
            if (name) {
                display.innerHTML = `<span class="text-lashDarkPink font-bold">餘額 $${acc.bal.toLocaleString()}</span> / ${acc.pts} 點`;
            } else {
                display.innerHTML = '輸入姓名查看餘額';
            }
        }

        // 切換支付方式連動扣除儲值金
        function handlePayMethodChange() {
            const method = document.getElementById('input-pay-method').value;
            if (method === '儲值扣款') {
                const finalStr = document.getElementById('display-final-price').innerText.replace(/[^0-9]/g, '');
                document.getElementById('input-deduct').value = finalStr;
            } else {
                document.getElementById('input-deduct').value = '';
            }
        }

        // 內部計算年齡用 (儲存時呼叫)
        function computeAge(birthdayInput) {
            if (!birthdayInput) return '';
            const birthDate = new Date(birthdayInput);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age > 0 ? age + ' 歲' : '0 歲';
        }

        // 計算並顯示折扣後金額，並自動計算「滿百送一點」的發放點數
        function calculateFinalPrice() {
            const orig = parseInt(document.getElementById('input-orig').value) || 0;
            const discount = document.getElementById('input-discount').value || '';
            let finalPrice = orig;

            if (discount.includes('折')) {
                const fold = parseFloat(discount.replace('折', '')) / 10;
                finalPrice = Math.round(orig * (isNaN(fold) ? 1 : fold));
            } else if (discount.includes('-')) {
                const minus = parseInt(discount.replace('-', '')) || 0;
                finalPrice = orig - minus;
            }

            document.getElementById('display-final-price').innerText = 'NT$ ' + finalPrice.toLocaleString();
            
            // 若為儲值扣款，自動同步扣除金額
            if (document.getElementById('input-pay-method').value === '儲值扣款') {
                document.getElementById('input-deduct').value = finalPrice;
            }

            // 自動計算發放點數：滿百送1點 (實收金額 / 100 取整數)
            const autoPoints = Math.floor(finalPrice / 100);
            document.getElementById('input-pts-add').value = autoPoints > 0 ? autoPoints : '';

            return finalPrice;
        }

        // 頁面初始化時預設計算一次點數
        setTimeout(() => {
            calculateFinalPrice();
        }, 100);

        function switchTab(tab) {
            const btnAdd = document.getElementById('btn-tab-add');
            const btnHist = document.getElementById('btn-tab-history');
            const panelAdd = document.getElementById('panel-add');
            const panelHist = document.getElementById('panel-history');

            if (tab === 'add') {
                btnAdd.className = "flex-1 bg-lashPink/40 text-gray-700 font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-sm border border-lashPink/60";
                btnHist.className = "flex-1 bg-gray-100 text-gray-500 font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition border border-transparent";
                panelAdd.classList.remove('hidden');
                panelHist.classList.add('hidden');
            } else {
                btnHist.className = "flex-1 bg-lashPink/40 text-gray-700 font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-sm border border-lashPink/60";
                btnAdd.className = "flex-1 bg-gray-100 text-gray-500 font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition border border-transparent";
                panelHist.classList.remove('hidden');
                panelAdd.classList.add('hidden');

                // 檢查是否已解鎖
                if (isHistoryUnlocked) {
                    document.getElementById('history-lock-screen').classList.add('hidden');
                    document.getElementById('history-content-screen').classList.remove('hidden');
                    renderHistory();
                } else {
                    document.getElementById('history-lock-screen').classList.remove('hidden');
                    document.getElementById('history-content-screen').classList.add('hidden');
                }
            }
        }

        // 解鎖歷史紀錄
        function unlockHistory() {
            const inputVal = document.getElementById('history-password-input').value;
            if (inputVal === CORRECT_PASSWORD) {
                isHistoryUnlocked = true;
                document.getElementById('history-password-input').value = '';
                document.getElementById('history-lock-screen').classList.add('hidden');
                document.getElementById('history-content-screen').classList.remove('hidden');
                renderHistory();
            } else {
                alert('密碼錯誤！');
            }
        }

        // 重新加鎖
        function lockHistory() {
            isHistoryUnlocked = false;
            document.getElementById('history-lock-screen').classList.remove('hidden');
            document.getElementById('history-content-screen').classList.add('hidden');
        }

        // 清除月份過濾，顯示全部
        function clearMonthFilter() {
            document.getElementById('history-month-filter').value = '';
            renderHistory();
        }

        // 搜尋舊客建議
        function filterCustomerSuggestions(query) {
            const container = document.getElementById('customer-suggestions');
            if (!query.trim()) {
                container.classList.add('hidden');
                return;
            }

            const matched = records.filter(r => r.name.toLowerCase().includes(query.toLowerCase()));
            const uniqueNames = [...new Set(matched.map(m => m.name))];

            if (uniqueNames.length === 0) {
                container.classList.add('hidden');
                return;
            }

            let html = '';
            uniqueNames.forEach(name => {
                const latest = records.find(r => r.name === name);
                html += `
                    <div onclick="fillCustomerData('${name}')" class="p-2.5 hover:bg-lashLight cursor-pointer text-xs border-b border-gray-100 flex justify-between items-center">
                        <span class="font-bold text-gray-800"><i class="fa-solid fa-user-check text-lashDarkPink mr-1.5"></i>${name} <span class="text-gray-400 font-normal">(${latest.phone || '無電話'})</span></span>
                        <span class="text-gray-400">上次：${latest.curl} / ${latest.total}根</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.classList.remove('hidden');
        }

        // 自動帶入舊客資料
        function fillCustomerData(name) {
            const latest = records.find(r => r.name === name);
            if (!latest) return;

            document.getElementById('input-name').value = latest.name;
            document.getElementById('input-phone').value = latest.phone || '';
            document.getElementById('input-artist').value = latest.artist || '';
            document.getElementById('input-curl').value = latest.curl;
            document.getElementById('input-total').value = latest.total;
            document.getElementById('input-thick').value = latest.thick;
            document.getElementById('input-type').value = latest.type;
            document.getElementById('input-glue').value = latest.glue;
            document.getElementById('input-orig').value = latest.price;
            document.getElementById('input-discount').value = latest.discount;
            document.getElementById('input-remark').value = latest.remark;
            document.getElementById('input-customertype').value = latest.typeLabel;

            if (latest.birthday) {
                document.getElementById('input-birthday').value = latest.birthday;
            } else {
                document.getElementById('input-birthday').value = '';
            }
            
            document.getElementById('input-next-visit').value = calculateNextVisit(document.getElementById('input-date').value);

            calculateFinalPrice(); // 舊客帶入後更新顯示金額與自動點數
            updateAccountDisplay(); // 舊客帶入後顯示儲值餘額

            document.getElementById('customer-suggestions').classList.add('hidden');
        }

        // 媒體上傳預覽與暫存
        function handleMediaUpload(event, boxId, placeholderId, index) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const box = document.getElementById(boxId);
                const placeholder = document.getElementById(placeholderId);
                box.style.backgroundImage = `url('${e.target.result}')`;
                box.classList.remove('hidden');
                placeholder.classList.add('hidden');
                
                // 儲存至暫存陣列
                uploadedImages[index - 1] = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // 開啟數字鍵盤
        function openKeypad(section, index) {
            const selector = section === 'left-up' ? '.lash-circle' : 
                             section === 'left-down' ? '.lash-circle-d' :
                             section === 'right-up' ? '.lash-circle-ru' : '.lash-circle-rd';
            const buttons = document.querySelectorAll(selector);
            currentActiveButton = buttons[index];
            document.getElementById('keypad-modal').classList.remove('hidden');
        }

        function closeKeypad() {
            document.getElementById('keypad-modal').classList.add('hidden');
            currentActiveButton = null;
        }

        function pressKey(val) {
            if (currentActiveButton) {
                currentActiveButton.innerText = val;
                if (val !== '') {
                    currentActiveButton.className = currentActiveButton.className.replace('bg-white', 'bg-lashPink font-semibold');
                } else {
                    currentActiveButton.className = currentActiveButton.className.replace('bg-lashPink font-semibold', 'bg-white');
                }
            }
            closeKeypad();
        }

        function clearForm() {
            document.getElementById('input-name').value = '';
            document.getElementById('input-phone').value = '';
            document.getElementById('input-total').value = '';
            document.getElementById('input-orig').value = '';
            document.getElementById('input-discount').value = '';
            document.getElementById('input-remark').value = '';
            document.getElementById('input-birthday').value = '';
            
            // 清除支付與儲值
            document.getElementById('input-pay-method').value = '現金';
            document.getElementById('input-topup').value = '';
            document.getElementById('input-deduct').value = '';
            document.getElementById('input-pts-sub').value = '';

            // 清除照片預覽與暫存
            uploadedImages = ['', '', ''];
            for(let i=1; i<=3; i++) {
                document.getElementById(`preview-box-${i}`).style.backgroundImage = '';
                document.getElementById(`preview-box-${i}`).classList.add('hidden');
                document.getElementById(`placeholder-${i}`).classList.remove('hidden');
            }
            
            // 恢復當天日期與預計回訪日
            const currentToday = new Date().toISOString().split('T')[0];
            document.getElementById('input-date').value = currentToday;
            document.getElementById('input-next-visit').value = calculateNextVisit(currentToday);

            document.querySelectorAll('.lash-circle, .lash-circle-d, .lash-circle-ru, .lash-circle-rd').forEach(btn => {
                btn.innerText = '';
                btn.className = btn.className.replace('bg-lashPink font-semibold', 'bg-white');
            });
            calculateFinalPrice(); // 清除後更新顯示金額
            updateAccountDisplay();
        }

        function saveRecord() {
            const name = document.getElementById('input-name').value || '未具名客戶';
            const phone = document.getElementById('input-phone').value || '';
            const artist = document.getElementById('input-artist').value || '';
            const total = document.getElementById('input-total').value || '100';
            const orig = parseInt(document.getElementById('input-orig').value) || 1600;
            const discount = document.getElementById('input-discount').value || '9折';
            const remark = document.getElementById('input-remark').value;
            const curl = document.getElementById('input-curl').value;
            const thick = document.getElementById('input-thick').value;
            const type = document.getElementById('input-type').value;
            const glue = document.getElementById('input-glue').value;
            const weather = `${document.getElementById('input-weather').value} 濕度${document.getElementById('input-humidity').value}% ${document.getElementById('input-temperature').value}°C`;
            const service = document.getElementById('input-service').value;
            const customertype = document.getElementById('input-customertype').value;
            const date = document.getElementById('input-date').value;
            const startTime = document.getElementById('input-starttime').value;
            const birthday = document.getElementById('input-birthday').value;
            const age = computeAge(birthday);
            const nextVisit = document.getElementById('input-next-visit').value;

            const payMethod = document.getElementById('input-pay-method').value;
            const topup = document.getElementById('input-topup').value;
            const deduct = document.getElementById('input-deduct').value;
            const ptsAdd = document.getElementById('input-pts-add').value;
            const ptsSub = document.getElementById('input-pts-sub').value;

            const finalPrice = calculateFinalPrice();
            
            // 計算當下最新餘額與點數
            const currentAcc = getCustomerBalances(name);
            const newBal = currentAcc.bal + (parseInt(topup) || 0) - (parseInt(deduct) || 0);
            const newPts = currentAcc.pts + (parseInt(ptsAdd) || 0) - (parseInt(ptsSub) || 0);

            const newRec = {
                date,
                name,
                phone,
                artist,
                service,
                time: startTime,
                birthday,
                age,
                nextVisit,
                weather,
                curl,
                total,
                thick,
                type,
                glue,
                price: orig.toLocaleString(),
                discount,
                final: finalPrice.toLocaleString(),
                payMethod,
                topup,
                deduct,
                ptsAdd,
                ptsSub,
                balance: newBal,
                ptsBalance: newPts,
                typeLabel: customertype,
                remark,
                photos: [...uploadedImages] // 儲存上傳的照片
            };

            records.unshift(newRec);
            localStorage.setItem('lash_records_v2', JSON.stringify(records));
            alert('紀錄已成功儲存！');
            switchTab('history');
        }

        function renderHistory() {
            const searchQuery = document.getElementById('history-search-input').value.trim();
            const selectedMonth = document.getElementById('history-month-filter').value;
            const listEl = document.getElementById('history-list');

            const today = new Date().toISOString().split('T')[0];
            const currentMonth = selectedMonth || today.substring(0, 7);

            let totalRev = 0;
            let monthRev = 0;
            let todayRev = 0;

            records.forEach(r => {
                const val = (r.payMethod === '儲值扣款') ? 0 : (parseInt(String(r.final).replace(/,/g, '')) || 0);
                const topupFee = parseInt(r.topup) || 0;
                const actualCash = val + topupFee;

                totalRev += actualCash;

                if (r.date && r.date.startsWith(currentMonth)) {
                    monthRev += actualCash;
                }
                if (r.date === today) {
                    todayRev += actualCash;
                }
            });

            document.getElementById('stat-revenue').innerText = 'NT$' + totalRev.toLocaleString();
            document.getElementById('stat-month-revenue').innerText = 'NT$' + monthRev.toLocaleString();
            document.getElementById('stat-today-revenue').innerText = 'NT$' + todayRev.toLocaleString();
            document.getElementById('stat-avg').innerText = 'NT$' + (records.length > 0 ? Math.round(totalRev / records.length).toLocaleString() : 0);

            const filtered = records.filter(r => {
                const matchName = r.name.toLowerCase().includes(searchQuery.toLowerCase()) || (r.phone && r.phone.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchMonth = selectedMonth ? (r.date && r.date.startsWith(selectedMonth)) : true;
                return matchName && matchMonth;
            });

            document.getElementById('stat-count').innerText = filtered.length;

            const currentToday = new Date().toISOString().split('T')[0];

            let html = '';
            filtered.forEach(rec => {
                let artistDisplay = rec.artist || '未填寫';
                if (artistDisplay !== '未填寫') {
                    let cleanAccount = artistDisplay.replace('@', '').trim();
                    let url = cleanAccount.startsWith('http') ? cleanAccount : `https://instagram.com/${cleanAccount}`;
                    artistDisplay = `<a href="${url}" target="_blank" class="text-lashDarkPink underline font-semibold hover:opacity-80">${rec.artist} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>`;
                }

                let phoneDisplay = rec.phone || '未填寫';
                if (phoneDisplay !== '未填寫') {
                    let cleanPhone = phoneDisplay.trim();
                    let isNum = /^[0-9+\-\s()]+$/.test(cleanPhone);
                    let phoneUrl = isNum ? `tel:${cleanPhone}` : `https://line.me/ti/p/~${cleanPhone.replace('@', '')}`;
                    phoneDisplay = `<a href="${phoneUrl}" target="_blank" class="text-lashDarkPink underline font-semibold hover:opacity-80">${rec.phone} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>`;
                }

                let followUpBadge = '';
                if (rec.nextVisit && rec.nextVisit <= currentToday) {
                    followUpBadge = `<span class="text-[10px] bg-red-100 text-red-500 px-1.5 py-0.5 rounded ml-1"><i class="fa-regular fa-bell"></i> 可關心</span>`;
                }

                // 照片呈現區塊
                let photosHtml = '';
                if (rec.photos && rec.photos.some(p => p !== '')) {
                    photosHtml += `<div class="grid grid-cols-3 gap-2 pt-2 border-t border-lashPink/35">`;
                    rec.photos.forEach((photo, idx) => {
                        if (photo) {
                            photosHtml += `<div class="h-16 bg-cover bg-center rounded-xl border border-lashPink/50 shadow-xs" style="background-image: url('${photo}')"></div>`;
                        } else {
                            photosHtml += `<div class="h-16 bg-gray-50 rounded-xl border border-gray-100 flex items-center justify-center text-[10px] text-gray-300">無照片</div>`;
                        }
                    });
                    photosHtml += `</div>`;
                }

                html += `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-lashPink/50 space-y-3">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-3">
                        <div class="flex items-center gap-3">
                            <div class="bg-lashPink/60 text-gray-700 px-3 py-1.5 rounded-xl text-center">
                                <span class="text-[10px] block text-gray-500">日期</span>
                                <span class="text-xs font-bold">${rec.date}</span>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${rec.name} · ${rec.artist || '未填寫'}</h4>
                                <p class="text-xs text-gray-400">${rec.service} · ${rec.curl}翹 · ${rec.total}根</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-bold text-lashDarkPink block">NT$${rec.final}</span>
                            <span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">${rec.typeLabel}</span>
                        </div>
                    </div>

                    <div class="text-xs text-gray-600 space-y-1.5 bg-lashLight p-3 rounded-xl">
                        <div class="flex justify-between items-center"><span class="text-gray-400">生日 / 年齡</span><span>${rec.birthday ? `${rec.birthday} <span class="text-[10px] bg-white border border-lashPink/50 px-1.5 py-0.5 rounded ml-1 text-gray-500">${rec.age}</span>` : '未提供'}</span></div>
                        <div class="flex justify-between items-center"><span class="text-gray-400">預計回訪日</span><span class="font-medium text-gray-700">${rec.nextVisit || '未設定'} ${followUpBadge}</span></div>
                        <div class="flex justify-between items-center"><span class="text-gray-400">Line ID / 電話</span><span>${phoneDisplay}</span></div>
                        <div class="flex justify-between items-center"><span class="text-gray-400">IG / Threads</span><span>${artistDisplay}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">服務</span><span>${rec.service}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">開始時間</span><span>${rec.time}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">天氣環境</span><span>${rec.weather}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">捲度/粗度</span><span>${rec.curl} 翹 / ${rec.thick} / ${rec.type}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">黑膠類型</span><span>${rec.glue}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">原始金額</span><span>NT$ ${rec.price} (${rec.discount})</span></div>
                        
                        <div class="my-2 border-t border-lashPink/30 pt-2"></div>
                        <div class="flex justify-between items-center"><span class="text-gray-400">支付方式</span><span class="font-bold text-gray-700">${rec.payMethod || '現金'}</span></div>
                        ${rec.topup ? `<div class="flex justify-between items-center"><span class="text-gray-400">儲值入帳</span><span class="text-emerald-600 font-bold">+NT$ ${rec.topup}</span></div>` : ''}
                        ${rec.deduct ? `<div class="flex justify-between items-center"><span class="text-gray-400">儲值扣款</span><span class="text-rose-500 font-bold">-NT$ ${rec.deduct}</span></div>` : ''}
                        ${(rec.balance !== undefined) ? `<div class="flex justify-between items-center"><span class="text-gray-400">儲值餘額</span><span class="text-gray-600">NT$ ${rec.balance}</span></div>` : ''}
                        ${(rec.ptsAdd || rec.ptsSub) ? `<div class="flex justify-between items-center"><span class="text-gray-400">點數異動</span><span class="text-blue-500">${rec.ptsAdd ? '+'+rec.ptsAdd : ''} ${rec.ptsSub ? '-'+rec.ptsSub : ''} 點 (餘 ${rec.ptsBalance} 點)</span></div>` : ''}

                        ${rec.remark ? `<div class="pt-1 text-red-500"><span class="text-gray-400 mr-2">備註:</span>${rec.remark}</div>` : ''}

                        ${photosHtml}
                    </div>
                </div>`;
            });
            listEl.innerHTML = html || '<div class="text-center text-gray-400 py-6 text-xs">查無符合的客戶資料</div>';
        }
    </script>
</body>
</html>
